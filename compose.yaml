services:
  api:
    build:
      context: .
      target: development
    command: ["air", "-c", ".air.api.toml"]
    env_file:
      - .env
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/bot/.cache/go-build

  bot:
    build:
      context: .
      target: development
    env_file:
      - .env
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/bot/.cache/go-build

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sot
      POSTGRES_USER: sot
      POSTGRES_PASSWORD: sot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sot -d sot"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./internal/database/migrations/000001_create_members.up.sql:/docker-entrypoint-initdb.d/000001_create_members.sql:ro

volumes:
  go-mod-cache:
  go-build-cache:
  postgres-data:
